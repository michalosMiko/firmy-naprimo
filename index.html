<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style><title>Práce napřímo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Práce napřímo">
<meta name="description" content="Oslovte podniky v okolí přímo – telefon, e-mail a hotové texty bez personalistů a inzerátů.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell – sticky header s filtry, seznam karet podniků; záložka Návody s přepínačem bloků a kartami textů ke zkopírování; spodní lišta (Firmy / Návody) */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16211F; --muted:#5E6B68; --line:#DDE3E1;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA; --warn:#9A5B00; --warn-soft:#FBEBD3;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18201F; --ink:#E8EEEC; --muted:#9AA8A5; --line:#2A3533;
  --accent:#4FC2AC; --accent-ink:#06201B; --accent-soft:#163A34; --warn:#F2B866; --warn-soft:#3A2A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18201F; --ink:#E8EEEC; --muted:#9AA8A5; --line:#2A3533;
  --accent:#4FC2AC; --accent-ink:#06201B; --accent-soft:#163A34; --warn:#F2B866; --warn-soft:#3A2A12; color-scheme:dark}
/* Režim Hledám službu = modrá, Hledám práci = zelená */
:root[data-mode="sluzba"]{--accent:#1F5FA8;--accent-ink:#FFFFFF;--accent-soft:#DCE8F7}
@media (prefers-color-scheme: dark){:root[data-mode="sluzba"]:not([data-theme="light"]){--accent:#7FB2F0;--accent-ink:#071A33;--accent-soft:#16263C}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.search{display:flex;gap:8px}
.search input,.search select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.search input{flex:1}
.search select{flex:0 1 40%;font-weight:600}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.mode button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.hcollapse{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-height:240px;overflow:hidden;transition:max-height .2s ease,opacity .2s ease,margin .2s ease}
header.compact .hcollapse{max-height:0;opacity:0;margin-bottom:-10px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.hcollapse{transition:none}}
.addr{color:var(--muted);font-size:13.5px;margin-top:2px}
details.more{font-size:13.5px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:4px;padding:2px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"▾";font-size:12px}
details.more[open] summary::after{content:"▴"}
details.more .inner{display:grid;gap:8px;margin-top:8px}
.hours{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13.5px;margin-top:4px}
.hours .txt{color:var(--muted)}
.state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.state.open{background:var(--accent-soft);color:var(--accent)}
.state.closed{background:var(--line);color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 0%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.nudge{border-color:var(--accent)!important;animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.nudge{animation:none;box-shadow:0 0 0 3px var(--accent-soft)}}
.hint{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 10px;font-size:13.5px;margin-top:-2px}
.hint b{color:var(--accent)}
header.compact .hint,header.compact .sugg{display:none}
.hint button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.wiz{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.wiz-dots{display:flex;gap:6px}
.wiz-dots i{width:26px;height:5px;border-radius:9px;background:var(--line)}
.wiz-dots i.on{background:var(--accent)}
.wiz-skip{background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:6px}
.wiz h2{font-family:var(--display);font-size:28px;letter-spacing:-.02em;margin:18px 0 4px;text-wrap:balance}
.wiz .lead{margin:0 0 16px}
.wiz-grid{display:grid;gap:10px;max-width:560px;width:100%}
.wiz-grid.two{grid-template-columns:1fr 1fr}
.wiz-card{display:grid;gap:4px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer}
.wiz-card b{font-size:18px}
.wiz-card span{color:var(--muted);font-size:14px}
.wiz-card:hover,.wiz-card:focus-visible{border-color:var(--accent)}
.wiz-card.prace{border-color:#0F6B5C33}.wiz-card.sluzba{border-color:#1F5FA833}
.wiz-card .ico{font-size:26px}
.wiz-opt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600;cursor:pointer;text-align:left}
.wiz-opt small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.wiz-opt:hover,.wiz-opt:focus-visible{border-color:var(--accent)}
.wiz-opt.all{grid-column:1/-1;background:var(--accent-soft);border-color:var(--accent-soft)}
.wiz-back{margin-top:16px;align-self:flex-start;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0}
.sugg{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:-4px}
.sugg button{display:flex;justify-content:space-between;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;font-size:14.5px}
.sugg button:hover,.sugg button:focus-visible{background:var(--accent-soft)}
.sugg small,.idx small{color:var(--muted);font-variant-numeric:tabular-nums}
.sugg .lbl{font-size:12px;color:var(--muted);padding:4px 10px 2px}
.chip.az{font-weight:700}
.idx{column-count:2;column-gap:10px}
@media (min-width:600px){.idx{column-count:3}}
.idx h3{font-family:var(--display);font-size:15px;color:var(--accent);margin:10px 2px 4px;break-after:avoid}
.idx h3:first-child{margin-top:0}
.idx button{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 6px;font-size:14px;text-align:left;cursor:pointer;break-inside:avoid}
.idx button:hover{border-color:var(--accent)}
.idx-lead{margin:0 2px;color:var(--muted);font-size:13.5px}
.druhbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.druhbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.druhbar strong{font-size:15px}
details.subidx{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
details.subidx summary{cursor:pointer;font-weight:600;font-size:14px}
details.subidx .idx{margin-top:10px}

main{padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:720px;margin:0 auto}
.area h2{font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 2px 8px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top>div{min-width:0}
.card h3{margin:0;font-size:17px;font-weight:600;line-height:1.25;text-wrap:balance}
.meta{color:var(--muted);font-size:13.5px}
.desc{font-size:14px;margin:0}
.tag{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);letter-spacing:.02em}
.facts{display:grid;gap:3px;font-size:13.5px;margin:0}
.facts div{display:flex;gap:8px;min-width:0}
.facts dt{color:var(--muted);flex:0 0 64px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;user-select:text}
.link{color:var(--accent);font-size:13.5px;text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.actions .wide{grid-column:1/-1}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:11px 10px;font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--ink)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.status{font-size:12.5px;color:var(--muted);text-align:center;margin:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;position:relative;background:none;border:0;padding:8px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}

/* Návody */
.ghead .brand{display:flex;justify-content:space-between;align-items:center}
.ghead{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:14px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-bottom:1px solid var(--line)}
.page-h{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0}
.lead{margin:0;color:var(--muted)}
.sec-intro{display:grid;gap:6px}
.sec-intro h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.item h3{margin:0;font-size:16px;font-weight:600;text-wrap:balance}
.when{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.item pre{margin:0;white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);border-radius:10px;padding:12px;overflow-wrap:anywhere;user-select:text}
.item .row{display:flex;gap:8px;flex-wrap:wrap}
.item .row .btn{flex:1 1 140px}
.default-badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.qa summary{cursor:pointer;font-weight:600}
details.qa p{margin:8px 0 0}
.about p{margin:0}
.about .sign{color:var(--muted);font-size:13.5px}
.about ul{margin:0;padding-left:20px;display:grid;gap:6px}
.about .soon{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:4px;vertical-align:1px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:88%;overflow:auto}
.sheet h3{margin:0;font-family:var(--display);font-size:20px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:200px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;z-index:10;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* nové: jazyk, Moje, štítky, vzdálenost, mapa */
.bright{display:flex;flex-direction:column-reverse;align-items:flex-end;gap:5px;min-width:0;text-align:right}
.brand h1{white-space:nowrap}
.langbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.star{border:0;background:none;font-size:23px;line-height:1;padding:0 2px;cursor:pointer;color:var(--muted)}
.star[aria-pressed="true"]{color:#D49A00}
.tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag.hire{background:var(--accent-soft);color:var(--accent)}
.tag.new{background:#ECE5FB;color:#5B3DB5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.new{background:#2C2346;color:#C9B8F5}}
.hire-line{font-size:13.5px;font-weight:600;color:var(--accent)}
.hire-line span{font-weight:400;color:var(--muted)}
.mstate{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:3px}
.dist{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;font-size:13.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#map{height:62vh;min-height:320px;border-radius:16px;border:1px solid var(--line);position:relative;z-index:0;isolation:isolate;overflow:hidden;background:var(--surface)}
.pop{display:grid;gap:3px;font-family:var(--body);font-size:13.5px}
.pop b{font-size:14.5px}.pop span{color:#5E6B68}
.pop-a{display:flex;gap:12px;margin-top:4px}.pop-a a{font-weight:700}
.mpanel{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.mst{display:flex;flex-wrap:wrap;gap:6px}
.mst button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.mst button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mpanel textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-height:58px;resize:vertical;font-size:14px}
.mmeta{font-size:12.5px;color:var(--muted)}
.remind{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.remind button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;border-radius:999px;padding:0 5px;min-width:17px;line-height:16px}
.langs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.langs button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#moje .lead{margin:0 2px}
</style></head><body>

<div id="view-firmy">
<header>
  <div class="hcollapse">
  <div class="brand"><h1>Práce napřímo</h1><span class="bright"><span class="count" id="count"></span><button class="langbtn" id="langbtn" data-langbtn type="button"></button></span></div>
  <div class="mode" role="group">
    <button type="button" data-mode="prace" aria-pressed="true" data-i18n="modePrace">Hledám práci</button>
    <button type="button" data-mode="sluzba" aria-pressed="false" data-i18n="modeSluzba">Hledám službu / info</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Hledat…" aria-label="Hledat">
    <select id="area" aria-label="Lokalita"></select>
  </div>
  </div>
  <div class="sugg" id="sugg" hidden></div>
  <div class="hint" id="hint" hidden></div>
  <div class="chips" id="chips" role="toolbar"></div>
</header>
<main id="firmy"></main>
</div>

<div id="view-moje" hidden>
<div class="ghead">
  <div class="brand"><h2 class="page-h" data-i18n="mojeH">Moje</h2><button class="langbtn" data-langbtn type="button"></button></div>
  <div class="chips" id="mchips" role="toolbar"></div>
</div>
<main id="moje"></main>
</div>

<div id="view-navody" hidden>
<div class="ghead">
  <div class="brand"><h2 class="page-h" data-i18n="navH">Návody</h2><button class="langbtn" data-langbtn type="button"></button></div>
  <div class="chips" id="gchips" role="toolbar"></div>
</div>
<main id="guide"></main>
</div>

<div id="view-onas" hidden>
<div class="ghead"><div class="brand"><h2 class="page-h" data-i18n="tabOnas">O aplikaci</h2><button class="langbtn" data-langbtn type="button"></button></div></div>
<main class="about" id="about"></main>
</div>

/* Pořadí lokalit: nejdřív NAHORU (v tomto pořadí), pak podle počtu podniků (nejplnější první).
   Až budou lokality zaplněné, přepni RAZENI_LOKALIT na "abeceda". */
const NAHORU=["Praha - Zbraslav"];
const RAZENI_LOKALIT="relevance"; // "relevance" nebo "abeceda"
function areaOrder(list){
  const cnt={};list.forEach(a=>cnt[a]=(cnt[a]||0)+1);
  const u=Object.keys(cnt);

/* ---------- otevírací doba: "Po–Pá 10–20, So zavřeno", "denně 11–22 (Pá–So do 23)", "sezóna 1. 4.–15. 10.; …" ---------- */
const DNY=["Po","Út","St","Čt","Pá","So","Ne"];
const hoursCache=new Map();
function parseHours(h){
  if(!h) return null;
  if(hoursCache.has(h)) return hoursCache.get(h);
  let s=String(h),season=null,out=null;
  const sm=s.match(/sezóna\s*(\d{1,2})\.\s*(\d{1,2})\.\s*[–-]\s*(\d{1,2})\.\s*(\d{1,2})\.\s*;?/i);
  if(sm){season=[+sm[2]*100+ +sm[1],+sm[4]*100+ +sm[3]];s=s.replace(sm[0],"")}
  if(/non-?stop|24\s*\/\s*7|24\s*hodin|^\s*0\s*[–-]\s*24\s*$/i.test(s)) out={sched:Array(7).fill([0,1440]),season};
  else if(!/sezónně|dle počasí|za příznivého/i.test(s)){
    s=s.replace(/\(([^)]*)\)/g,", $1").replace(/^(?!denně)[a-zěščřžýáíéůúň]+\s+/,"");
    const tm=x=>{const [a,b]=x.split(":");return +a*60+(+b||0)};
    const sched=Array(7).fill(null);let pending=[],any=false;
    for(const seg of s.split(/[,;]/)){
      const t=seg.trim();if(!t)continue;
      let days=/denně/.test(t)?[0,1,2,3,4,5,6]:[];
      const re=/(Po|Út|St|Čt|Pá|So|Ne)(?:\s*[–-]\s*(Po|Út|St|Čt|Pá|So|Ne))?/g;let m;
      while((m=re.exec(t))){const a=DNY.indexOf(m[1]),b=m[2]?DNY.indexOf(m[2]):a;for(let i=a;;i=(i+1)%7){days.push(i);if(i===b)break}}
      if(/zavřeno/i.test(t)){days.forEach(d=>sched[d]=false);any=true;continue}
      const r=t.match(/(\d{1,2}(?::\d{2})?)\s*[–-]\s*(\d{1,2}(?::\d{2})?)/);
      const until=t.match(/do\s+(\d{1,2}(?::\d{2})?)/);
      if(r){let o=tm(r[1]),c=tm(r[2]);if(c<=o)c+=1440;const ds=[...pending,...days];(ds.length?ds:[0,1,2,3,4,5,6]).forEach(d=>sched[d]=[o,c]);pending=[];any=true}
      else if(until){const c0=tm(until[1]);days.forEach(d=>{if(sched[d]){let c=c0;if(c<=sched[d][0])c+=1440;sched[d]=[sched[d][0],c]}})}
      else pending.push(...days);
    }
    if(any) out={sched,season};
  }
  hoursCache.set(h,out);return out;
}
function isOpen(h,now=new Date()){
  const p=parseHours(h);if(!p)return null;
  if(p.season){const md=(now.getMonth()+1)*100+now.getDate();if(md<p.season[0]||md>p.season[1])return false}
  const d=(now.getDay()+6)%7,t=now.getHours()*60+now.getMinutes();
  const a=p.sched[d];if(a&&t>=a[0]&&t<a[1])return true;
  const y=p.sched[(d+6)%7];if(y&&y[1]>1440&&t<y[1]-1440)return true;
  return false;
}
function openRank(h){const o=isOpen(h);return o===true?0:o===null?1:2} // otevřeno, neznámo, zavřeno

  if(iso&&daysSince(iso)>60)return null;return {txt:txt||"",d:iso}}
function km(f){if(!st.near||f.lat==null)return null;const R=6371,r=x=>x*Math.PI/180;const dLa=r(f.lat-st.near.lat),dLo=r(f.lng-st.near.lng);
  const a=Math.sin(dLa/2)**2+Math.cos(r(st.near.lat))*Math.cos(r(f.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function fmtKm(k){return k<1?Math.round(k*1000/50)*50+" m":(Math.round(k*10)/10).toLocaleString(LOC[st.lang])+" km"}

const HDAY={uk:{Po:"Пн",Út:"Вт",St:"Ср",Čt:"Чт",Pá:"Пт",So:"Сб",Ne:"Нд",denně:"щодня",zavřeno:"зачинено",nonstop:"цілодобово",sezóna:"сезон",do:"до","po telefonické domluvě":"за телефонною домовленістю"},
 en:{Po:"Mon",Út:"Tue",St:"Wed",Čt:"Thu",Pá:"Fri",So:"Sat",Ne:"Sun",denně:"daily",zavřeno:"closed",nonstop:"24/7",sezóna:"season",do:"until","po telefonické domluvě":"by phone appointment"}};
function hoursText(h){const m=HDAY[st.lang];if(!m||!h)return h||"";return String(h).replace(/po telefonické domluvě|denně|zavřeno|nonstop|sezóna|\bdo\b|Po|Út|St|Čt|Pá|So|Ne/g,x=>m[x]||x)}

  return `<article class="card">

    ${hi&&hi.txt?`<div class="hire-line">${esc(T("hiringDet",{txt:hi.txt}))}${hi.d?` <span>(${esc(T("checked",{d:fmtDate(hi.d)}))})</span>`:""}</div>`:""}
    <details class="more"><summary>${esc(T("details"))}</summary><div class="inner">

/* ---------- mapa (Leaflet + OpenStreetMap, načte se až při prvním otevření) ---------- */
let LMAP=null,leafletP=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(leafletP)return leafletP;
  leafletP=new Promise((ok,ko)=>{const c=document.createElement("link");c.rel="stylesheet";c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(c);
    const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)});return leafletP}
async function drawMap(items){
  const box=$("#map");if(!box)return;
  try{await loadLeaflet()}catch(e){box.textContent=T("mapNone");return}
  if(LMAP){LMAP.remove();LMAP=null}
  const pts=items.filter(([f])=>f.lat!=null);
  LMAP=L.map(box,{scrollWheelZoom:false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(LMAP);
  const b=[];
  pts.forEach(([f,i])=>{const ph=firstPhone(f.telefon);
    const m=L.circleMarker([f.lat,f.lng],{radius:8,weight:2,color:getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#0F6B5C",fillOpacity:.85}).addTo(LMAP);
    m.bindPopup(`<div class="pop"><b>${esc(f.nazev)}</b>${f.druh?`<span>${esc(cap(druhName(f.druh)))}</span>`:""}${st.mode==="sluzba"&&f.hodiny?`<span>${esc(hoursText(f.hodiny))}</span>`:""}
      <div class="pop-a">${ph?`<a href="tel:${ph}" data-call="${i}">${esc(T("call"))}</a>`:""}<a href="${mapUrl(f)}" target="_blank" rel="noopener">${esc(T("navigate"))}</a></div></div>`);
    b.push([f.lat,f.lng])});
  if(st.near){L.circleMarker([st.near.lat,st.near.lng],{radius:7,color:"#2563eb",fillColor:"#2563eb",fillOpacity:1}).addTo(LMAP);b.push([st.near.lat,st.near.lng])}
  if(b.length)LMAP.fitBounds(b,{padding:[30,30],maxZoom:16});else LMAP.setView([49.975,14.394],13);
}

function toolsHtml(n){return `<div class="tools"><button class="tool" data-near aria-pressed="${!!st.near}">📍 ${esc(T("near"))}</button><button class="tool" data-view="${st.view==="map"?"list":"map"}" aria-pressed="${st.view==="map"}">${st.view==="map"?"☰ "+esc(T("listBtn")):"🗺 "+esc(T("mapBtn"))}</button></div>`}

function render(){
  renderAreas(); renderChips(); renderSugg(); renderHint();
  if(st.obor===AZ&&!hasDruhy()) st.obor="Gastronomie";
  const q=norm(st.q);
  const inArea=firmy.filter(f=>!st.area||f.oblast===st.area);
  const tot=inArea.length;
  $("#count").textContent=nT("total",tot);
  if(LMAP&&(st.view!=="map")){LMAP.remove();LMAP=null}
  if(st.pin){
    const items=firmy.map((f,i)=>[f,i]).filter(([f])=>f.nazev===st.pin);
    $("#firmy").innerHTML=`<div class="druhbar"><button data-unpin="1">← ${esc(T("allFirms"))}</button></div>`+(items.length?`<div class="list">${items.map(([f,i])=>card(f,i)).join("")}</div>`:`<div class="empty">${esc(dataSource==="live"?T("nothing"):T("loading"))}</div>`);
    return;
  }
  if(st.obor===AZ&&!st.druh&&!q&&!st.nove){
    const c=druhCounts(inArea);
    $("#firmy").innerHTML=`<p class="idx-lead">${esc(T("idxLead",{n:c.size,a:st.area?T("inArea",{a:shortArea(st.area)}):""}))}</p>`+(c.size?idxHtml(c,true):`<div class="empty"><strong>${esc(T("nothing"))}</strong>${esc(T("tryArea"))}</div>`);
    return;
  }
  const allObory=st.obor===AZ||st.nove;
  let list=firmy.map((f,i)=>[f,i]).filter(([f])=>(allObory||f.obor===st.obor) && (!st.druh||f.druh===st.druh) && (!st.area||f.oblast===st.area) && (!st.nove||isNew(f)) &&
    (!q||norm([f.nazev,f.adresa,f.mesto,f.styl,f.popis,f.druh,druhName(f.druh)].join(" ")).includes(q)));
  list.forEach(x=>x[2]=km(x[0]));
  list.sort((a,b)=>(st.near?(a[2]==null)-(b[2]==null)||(a[2]??0)-(b[2]??0):0)||(st.mode==="sluzba"?openRank(a[0].hodiny)-openRank(b[0].hodiny):(!hiring(a[0]))-(!hiring(b[0])))||ABC.compare(a[0].nazev||"",b[0].nazev||""));
  const status=`<p class="status">${esc(dataSource==="live"?T("live"):T("dataAt",{d:DATA_DATE}))}</p>`;
  let top="";
  if(st.nove) top=`<div class="druhbar"><button data-back="1">← ${esc(T("back"))}</button><strong>${esc(T("newH"))}</strong></div>`;
  else if(st.druh) top=`<div class="druhbar"><button data-back="1">← ${st.obor===AZ?esc(T("backAll")):esc(oborName(st.obor))}</button><strong>${esc(cap(druhName(st.druh)))}</strong></div>`;
  else if(st.obor!==AZ&&!q){const c=druhCounts(inArea.filter(f=>f.obor===st.obor));if(c.size>1)top=`<details class="subidx"><summary>${esc(T("refine",{n:c.size}))}</summary>${idxHtml(c,false)}</details>`}
  if(!list.length){
    if(st.druh||st.obor===AZ||st.nove){$("#firmy").innerHTML=top+`<div class="empty"><strong>${esc(T("nothing"))}</strong>${esc(st.area?T("tryAll"):T("tryWord"))}</div>`;return}
    const none=!firmy.some(f=>f.obor===st.obor);
    $("#firmy").innerHTML=`<div class="empty"><strong>${esc(none?T("oborSoon",{o:oborName(st.obor)}):st.area&&!st.q?T("oborNone",{o:oborName(st.obor),a:shortArea(st.area)}):T("nothing"))}</strong>${esc(none?T("oborSoonT"):st.area&&!st.q?T("oborNoneT"):T("tryOther"))}</div>`;return;
  }
  top+=toolsHtml(list.length);
  if(st.near&&list.some(x=>x[2]==null))top+=`<p class="status">${esc(T("nearOn"))}. ${esc(T("nearNoGps"))}</p>`;
  if(st.view==="map"){
    const n=list.filter(([f])=>f.lat!=null).length;
    $("#firmy").innerHTML=top+(n?`<div id="map"></div>${n<list.length?`<p class="status">${esc(T("mapPart",{n,m:list.length}))}</p>`:""}`:`<div class="empty">${esc(T("mapNone"))}</div>`);
    if(n)drawMap(list);
    return;
  }
  let body;
  if(st.near) body=`<div class="list">${list.map(([f,i])=>card(f,i)).join("")}</div>`;
  else{
    const groups={};list.forEach(x=>(groups[x[0].oblast]??=[]).push(x));
    const ord=areaOrder(firmy.filter(f=>allObory||f.obor===st.obor).map(f=>f.oblast));
    body=Object.entries(groups).sort((x,y)=>ord.indexOf(x[0])-ord.indexOf(y[0])).map(([a,items])=>
      `<section class="area"><h2>${esc(shortArea(a))} · ${items.length}</h2><div class="list">${items.map(([f,i])=>card(f,i)).join("")}</div></section>`).join("");
  }
  $("#firmy").innerHTML=top+body+status;
}

function message(f){const t=tplById(defTpl)||tplById(DEFAULT_TPL);const m=splitMail(t.x);return {subj:m.subj,body:m.body.replace(/\[podnik\]/g,f.nazev)}}
function mailHref(f,subj,body){return `mailto:${encodeURIComponent(f.email||"")}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`}
function compose(f){
  const m=message(f);
  if(f.email){track("napsat-email");location.href=mailHref(f,m.subj,m.body)} else track("napsat-bez-emailu");
  showSheet(f,m);
}
function showSheet(f,m){
  document.querySelector(".sheet-bg")?.remove();
  const has=!!f.email;
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(T("shFor",{n:f.nazev}))}">
    <h3>${has?esc(T("shOpening")):esc(T("shFor",{n:f.nazev}))}</h3>
    ${has?`<p class="hint">${T("shHas",{e:esc(f.email)})}</p>`:`<p class="hint">${esc(T("shNo"))}</p>`}
    <div class="field"><label for="msgtxt">${esc(T("shText"))}</label><textarea id="msgtxt" lang="cs">${esc(m.body)}</textarea></div>
    <div class="actions">
      ${has?`<a class="btn primary" id="sendmail" href="${mailHref(f,m.subj,m.body)}">${ICON.mail} ${esc(T("shOpen"))}</a>`:""}
      <button class="btn${has?"":" primary"}" id="copymsg">${esc(T("shCopy"))}</button>
      ${has?`<button class="btn wide" id="copyaddr">${esc(T("shAddr"))}</button>`:""}
      <button class="btn wide" id="othertpl">${esc(T("shOther"))}</button>
    </div>
    <button class="btn" id="closesheet">${esc(T("close"))}</button></div>`;
  document.body.appendChild(bg);
  const ta=bg.querySelector("#msgtxt");
  ta.addEventListener("input",()=>{const a=bg.querySelector("#sendmail");if(a)a.href=mailHref(f,m.subj,ta.value)});
  bg.querySelector("#copymsg").onclick=async()=>{if(!await copy(ta.value)){ta.select();toast(T("selected"))}};
  bg.querySelector("#copyaddr")?.addEventListener("click",()=>copy(f.email,T("addrCopied")));
  bg.querySelector("#othertpl").onclick=()=>{bg.remove();st.sec="email";show("navody")};
  bg.querySelector("#closesheet").onclick=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg)bg.remove()});
}

async function shareFirm(f){const url=shareUrl(f),title=f.nazev,text=T("shareTxt",{n:f.nazev});track("sdilet");

function cardClick(e,inMoje){
  const m=e.target.closest("[data-mail]");if(m){const f=firmy[+m.dataset.mail];autoLog(f,"napsano");compose(f);if(inMoje)renderMoje();return true}
  const t=e.target.closest("[data-call]");if(t){track("zavolat");const f=firmy[+t.dataset.call];const ph=firstPhone(f.telefon);if(ph)copy(ph,T("numCopied"));autoLog(f,"volano");if(inMoje)setTimeout(renderMoje,0);return true}

  const v=e.target.closest("[data-view]");if(v){st.view=v.dataset.view;if(st.view==="map")track("mapa");render();return}

/* ---------- živá data z veřejné tabulky ---------- */
function parseCSV(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}row.push(c);r.push(row);return r}
function prep(f){const m=String(f.gps||"").match(/(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)/);if(m){f.lat=+m[1];f.lng=+m[2]}else{f.lat=null;f.lng=null}f.pridano=isoOf(f.pridano);return f}
async function loadLive(){
  if(!LIVE_CSV_URL && !SHEET_ID) return;
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),10000);
    let res=null;
    for(const u of [LIVE_CSV_URL, SHEET_ID&&`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`].filter(Boolean)){
      try{const r=await fetch(u,{signal:ctl.signal,cache:"no-store"});if(r.ok&&!/^\s*</.test(await r.clone().text())){res=r;break}}catch(e){}
    }
    if(!res) return;
    const rows=parseCSV(await res.text());
    const h=rows[0].map(x=>norm(x).trim());
    const AL={druh:["druh","druh (pro statistiku)"],oblast:["oblast","lokalita"],nazev:["nazev","nazev podniku"],email:["email","e-mail pro aplikaci"],hodiny:["hodiny","oteviraci doba"],styl:["styl","druh kuchyne / styl"],overeno:["overeno","stav overeni udaju"],
      pridano:["pridano","pridano (datum)"],nabira:["hleda lidi","hleda lidi (pozice | datum)"],gps:["gps","gps (lat, lng)"]};
    const ix=k=>{for(const a of (AL[k]||[k])){const i=h.indexOf(a);if(i>=0)return i}return -1};
    if(ix("nazev")<0) return;
    const keys=["oblast","obor","nazev","adresa","mesto","telefon","email","web","hodiny","styl","popis","overeno","druh","pridano","nabira","gps"];
    const data=rows.slice(1).filter(r=>r[ix("nazev")]).map(r=>{const o={};keys.forEach(k=>o[k]=ix(k)>=0?(r[ix(k)]||"").trim():"");o.obor=o.obor||"Gastronomie";return prep(o)});
    if(data.length){firmy=data;dataSource="live";render();if(!$("#view-moje").hidden)renderMoje();renderHint()}
  }catch(e){/* zůstanou vložená data */}
}
firmy.forEach(prep);

/* hlavička: při posouvání dolů se schová hledání, obory zůstanou */
(()=>{let last=0,lock=0;const hdr=document.querySelector("#view-firmy header");
  const set=c=>{if(hdr.classList.contains("compact")===c)return;hdr.classList.toggle("compact",c);lock=Date.now()+400};
  addEventListener("scroll",()=>{const y=scrollY;
    if(y<60){set(false);last=y;return}
    if(Date.now()<lock){last=y;return}
    if(document.activeElement===$("#q")||document.activeElement===$("#area"))set(false);
    else if(y>last+20)set(true);else if(y<last-40)set(false);
    if(Math.abs(y-last)>20)last=y;},{passive:true});})();

function renderHint(){
  const h=$("#hint"),a=$("#area");
  const need=!st.area&&!store.get("areaPicked")&&!store.get("hintOff");
  a.classList.toggle("nudge",need);
  const nNew=NEWREF?firmy.filter(f=>isNew(f)&&(!st.area||f.oblast===st.area)).length:0;
  if(need){h.innerHTML=`📍 <span>${T("areaHint")}</span><button aria-label="${esc(T("closeHint"))}" data-x="area">×</button>`;h.hidden=false}
  else if(nNew&&!st.nove&&store.get("newOff")!==NEWREF){h.innerHTML=`🆕 <span>${nT("newHint",nNew)} <a href="#" class="link" data-shownew>${esc(T("newShow"))}</a></span><button aria-label="${esc(T("closeHint"))}" data-x="new">×</button>`;h.hidden=false}
  else{h.hidden=true;h.innerHTML=""}
}

const wiz={step:1};
function langRow(){return `<div class="langs" role="group" aria-label="${esc(T("langQ"))}">${LANGS.map(([c,fl,n])=>`<button data-w="lang" data-v="${c}" aria-pressed="${st.lang===c}" lang="${c}">${fl} ${n}</button>`).join("")}</div>`}
function wizShow(step){
  wiz.step=step;let el=$("#wiz");
  if(!el){el=document.createElement("div");el.id="wiz";el.className="wiz";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el);document.body.style.overflow="hidden"}
  const dots=`<div class="wiz-dots">${[1,2,3].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
  let h=`<div class="wiz-top">${dots}<button class="wiz-skip" data-w="skip">${esc(T("wSkip"))}</button></div>`;
  if(step===1){
    h+=`${langRow()}<h2>${esc(T("wQ1"))}</h2><p class="lead">${esc(T("wL1"))}</p><div class="wiz-grid">
      <button class="wiz-card prace" data-w="mode" data-v="prace"><span class="ico">💼</span><b>${esc(T("wPraceT"))}</b><span>${esc(T("wPraceD"))}</span></button>
      <button class="wiz-card sluzba" data-w="mode" data-v="sluzba"><span class="ico">🔧</span><b>${esc(T("wSluzbaT"))}</b><span>${esc(T("wSluzbaD"))}</span></button></div>`;
  } else if(step===2){
    const areas=areaOrder(firmy.map(f=>f.oblast).filter(Boolean));
    const cnt=a=>firmy.filter(f=>f.oblast===a).length;
    h+=`<h2>${esc(T("wQ2"))}</h2><p class="lead">${esc(T("wL2"))}</p><div class="wiz-grid two">
      ${areas.map(a=>`<button class="wiz-opt" data-w="area" data-v="${esc(a)}">${esc(shortArea(a))}<small>${cnt(a)}</small></button>`).join("")}
      <button class="wiz-opt all" data-w="area" data-v="">${esc(T("all"))}<small>${firmy.length}</small></button></div>
      <button class="wiz-back" data-w="back">${esc(T("wBack"))}</button>`;
  } else {
    const pool=firmy.filter(f=>!st.area||f.oblast===st.area);
    const ob=OBORY.filter(o=>pool.some(f=>f.obor===o));
    h+=`<h2>${esc(T("wQ3"))}</h2><p class="lead">${esc(nT("wL3",pool.length,{a:st.area?shortArea(st.area)+": ":""}))}</p><div class="wiz-grid two">
      ${ob.map(o=>`<button class="wiz-opt" data-w="obor" data-v="${o}">${esc(oborName(o))}<small>${pool.filter(f=>f.obor===o).length}</small></button>`).join("")}
      ${hasDruhy()?`<button class="wiz-opt all" data-w="obor" data-v="${AZ}">${esc(T("wAz"))}<small>${pool.length}</small></button>`:""}</div>
      <button class="wiz-back" data-w="back">${esc(T("wBack"))}</button>`;
  }
  el.innerHTML=h;el.scrollTop=0;
}
function wizClose(done){const el=$("#wiz");if(el)el.remove();document.body.style.overflow="";store.set("onb",true);track(done?"pruvodce-dokoncen":"pruvodce-preskocen",true);applyMode();render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const b=e.target.closest("#wiz [data-w]");if(!b)return;const w=b.dataset.w,v=b.dataset.v;
  if(w==="skip")return wizClose(false);
  if(w==="back")return wizShow(Math.max(1,wiz.step-1));
  if(w==="lang"){setLang(v);return wizShow(1)}
  if(w==="mode"){st.mode=v;store.set("mode",v);applyMode();track("rezim-"+v);return wizShow(2)}
  if(w==="area"){st.area=v;store.set("area",v);store.set("areaPicked",true);return wizShow(3)}
  if(w==="obor"){st.obor=v;st.druh="";if(v!==AZ)store.set("obor",v);return wizClose(true)}
});
function startWizard(){wizShow(1)}

/* ---------- přepínání jazyka ---------- */
function applyLang(){
  document.documentElement.lang=st.lang;
  COLL=new Intl.Collator(st.lang,{sensitivity:"base",numeric:true});
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=T(el.dataset.i18n));
  $("#q").placeholder=T("search");$("#q").setAttribute("aria-label",T("search"));$("#area").setAttribute("aria-label",T("area"));
  const L=LANGS.find(x=>x[0]===st.lang);document.querySelectorAll("[data-langbtn]").forEach(b=>{b.textContent=L[1]+" "+L[0].toUpperCase();b.setAttribute("aria-label",T("langQ")+": "+L[2])});
}
function setLang(l){if(!I18N[l])return;st.lang=l;store.set("lang",l);track("jazyk-"+l);applyLang();render();
  if(!$("#view-navody").hidden)renderGuide();if(!$("#view-moje").hidden)renderMoje();if(!$("#view-onas").hidden)renderAbout()}
document.addEventListener("click",e=>{if(!e.target.closest("[data-langbtn]"))return;
  document.querySelector(".sheet-bg")?.remove();
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(T("langQ"))}"><h3>${esc(T("langQ"))}</h3>${langRow().replace(/data-w="lang"/g,'data-lang')}<button class="btn" id="closesheet">${esc(T("close"))}</button></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(b){setLang(b.dataset.v);bg.remove();return}if(e.target===bg||e.target.id==="closesheet")bg.remove()});
});

st.area=typeof store.get("area")==="string"?store.get("area"):"";
st.obor=OBORY.includes(store.get("obor"))?store.get("obor"):"Gastronomie";
st.mode=store.get("mode")==="sluzba"?"sluzba":"prace";
st.lang=(()=>{const s=store.get("lang");if(I18N[s])return s;const n=(navigator.languages||[navigator.language||""]).map(x=>String(x).toLowerCase());return n.some(x=>x.startsWith("uk"))?"uk":"cs"})();
try{const p=new URLSearchParams(location.search).get("p");if(p)st.pin=p;const l=new URLSearchParams(location.search).get("lang");if(I18N[l]){st.lang=l;store.set("lang",l)}}catch(e){}
function applyMode(){document.querySelectorAll(".mode button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===st.mode)));
  const sl=st.mode==="sluzba";document.documentElement.dataset.mode=st.mode;$("#tab-navody").hidden=sl}
document.querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;store.set("mode",st.mode);track("rezim-"+st.mode);applyMode();render()});
applyLang();applyMode();renderTabBadge();
render(); loadLive();
const h0=(location.hash||"").slice(1); if(["navody","onas","moje"].includes(h0)) show(h0);
else if(!store.get("onb")&&!st.pin) startWizard();
</script>
</body></html>
