<title>Práce napřímo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Práce napřímo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sticky header with sector chips, scrolling list of company cards, bottom tab bar (Firmy / Životopis) */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16211F; --muted:#5E6B68; --line:#DDE3E1;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA; --warn:#9A5B00; --warn-soft:#FBEBD3;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18201F; --ink:#E8EEEC; --muted:#9AA8A5; --line:#2A3533;
  --accent:#4FC2AC; --accent-ink:#06201B; --accent-soft:#163A34; --warn:#F2B866; --warn-soft:#3A2A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18201F; --ink:#E8EEEC; --muted:#9AA8A5; --line:#2A3533;
  --accent:#4FC2AC; --accent-ink:#06201B; --accent-soft:#163A34; --warn:#F2B866; --warn-soft:#3A2A12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.search{display:flex;gap:8px}
.search input,.search select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.search input{flex:1}
.search select{flex:0 1 42%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

main{padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;max-width:720px;margin:0 auto}
.area h2{font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 2px 8px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:17px;font-weight:600;line-height:1.25;text-wrap:balance}
.meta{color:var(--muted);font-size:13.5px}
.desc{font-size:14px;margin:0}
.tag{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);letter-spacing:.02em}
.facts{display:grid;gap:3px;font-size:13.5px}
.facts div{display:flex;gap:8px;min-width:0}
.facts dt{color:var(--muted);flex:0 0 64px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:11px 10px;font-weight:600;font-size:14.5px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}
.link{color:var(--accent);font-size:13.5px;text-decoration:none;font-weight:500}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;padding:8px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}

/* CV form */
.cv{display:grid;gap:14px}
.cv h2{font-family:var(--display);font-weight:800;font-size:24px;margin:4px 0 0;letter-spacing:-.01em}
.cv p.lead{margin:0;color:var(--muted)}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.field textarea{min-height:92px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.saved{font-size:13px;color:var(--accent);min-height:1.2em}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere}

/* sheet (compose dialog) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:88%;overflow:auto}
.sheet h3{margin:0;font-family:var(--display);font-size:20px}
.sheet .field textarea{min-height:200px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13.5px;z-index:10}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header id="hdr">
  <div class="brand"><h1>Práce napřímo</h1><span class="count" id="count"></span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Hledat název, ulici, styl…" aria-label="Hledat">
    <select id="area" aria-label="Lokalita"></select>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Obory"></div>
</header>

<main id="view-firmy"></main>

<main id="view-cv" hidden>
  <form class="cv" id="cvform" autocomplete="on">
    <div>
      <h2>Můj životopis</h2>
      <p class="lead">Vyplň jednou. Text se vloží do každé zprávy, kterou firmě pošleš. Ukládá se jen v tomto telefonu.</p>
    </div>
    <div class="row2">
      <div class="field"><label for="cv-jmeno">Jméno a příjmení</label><input id="cv-jmeno" name="jmeno" autocomplete="name"></div>
      <div class="field"><label for="cv-pozice">Hledaná pozice</label><input id="cv-pozice" name="pozice" placeholder="např. provozní, číšník, barman"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="cv-tel">Telefon</label><input id="cv-tel" name="tel" type="tel" autocomplete="tel"></div>
      <div class="field"><label for="cv-email">E-mail</label><input id="cv-email" name="email" type="email" autocomplete="email"></div>
    </div>
    <div class="field"><label for="cv-praxe">Praxe</label><textarea id="cv-praxe" name="praxe" placeholder="Kde jsi pracoval, jak dlouho a co jsi měl na starosti"></textarea></div>
    <div class="field"><label for="cv-dovednosti">Dovednosti a jazyky</label><textarea id="cv-dovednosti" name="dovednosti" placeholder="např. pokladní systémy, vedení směny, angličtina"></textarea></div>
    <div class="row2">
      <div class="field"><label for="cv-uvazek">Úvazek</label>
        <select id="cv-uvazek" name="uvazek"><option>Plný úvazek</option><option>Zkrácený úvazek</option><option>Brigáda / DPP</option><option>Cokoli</option></select></div>
      <div class="field"><label for="cv-nastup">Nástup</label><input id="cv-nastup" name="nastup" placeholder="např. ihned, od 1. 11."></div>
    </div>
    <div class="field"><label for="cv-text">Vlastní text zprávy (nepovinné)</label><textarea id="cv-text" name="text" placeholder="Když necháš prázdné, aplikace napíše zprávu za tebe"></textarea></div>
    <div class="saved" id="saved" aria-live="polite"></div>
    <div><div class="field"><label>Náhled zprávy pro firmu</label></div><div class="preview" id="cvprev"></div></div>
  </form>
</main>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-firmy" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>Firmy</button>
  <button class="tab" role="tab" id="tab-cv" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Životopis</button>
</nav>

  const areas=[...new Set(firmy.filter(f=>f.obor===st.obor).map(f=>f.oblast))];
  if(!areas.includes(st.area)) st.area="";
  $("#area").innerHTML=`<option value="">Všechny lokality</option>`+areas.map(a=>`<option ${a===st.area?"selected":""}>${esc(a)}</option>`).join("");
}
function card(f,i){
  const ph=firstPhone(f.telefon);
  const facts=[["Adresa",[f.adresa,f.mesto&&f.mesto!==f.oblast?f.mesto:""].filter(Boolean).join(", ")],["Telefon",f.telefon],["Otevřeno",f.hodiny],["E-mail",f.email]].filter(x=>x[1]);
  return `<article class="card">
    <div class="top"><div><h3>${esc(f.nazev)}</h3>${f.styl?`<div class="meta">${esc(f.styl)}</div>`:""}</div>
    ${/Neověřeno|částečně/.test(f.overeno||"")?`<span class="tag" title="Údaje zatím nejsou ověřené">Ověřit</span>`:""}</div>
    ${f.popis?`<p class="desc">${esc(f.popis)}</p>`:""}
    <dl class="facts">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
    ${f.web?`<a class="link" href="${esc(webUrl(f.web))}" target="_blank" rel="noopener">${esc(f.web.replace(/^https?:\/\//,""))} ↗</a>`:""}
    <div class="actions">
      <a class="btn primary" ${ph?`href="tel:${ph}"`:'aria-disabled="true"'} data-copy="${esc(ph)}">${ICON.tel} Zavolat</a>
      <button class="btn" data-mail="${i}">${ICON.mail} Napsat</button>
    </div></article>`;
}
function render(){
  renderChips(); renderAreas();
  const q=norm(st.q);
  const list=firmy.map((f,i)=>[f,i]).filter(([f])=>f.obor===st.obor && (!st.area||f.oblast===st.area) &&
    (!q||norm([f.nazev,f.adresa,f.styl,f.popis,f.mesto].join(" ")).includes(q)));
  $("#count").textContent=`${list.length} ${list.length===1?"firma":list.length<5&&list.length>0?"firmy":"firem"}`;
  if(!list.length){
    const none=!firmy.some(f=>f.obor===st.obor);
    $("#view-firmy").innerHTML=`<div class="empty"><strong>${none?`Obor ${esc(st.obor)} zatím nemá data`:"Nic nenalezeno"}</strong>${none?"Až v tabulce přibudou firmy s tímto oborem, objeví se tady.":"Zkus jiné slovo nebo jinou lokalitu."}</div>`;return;
  }
  const groups={};list.forEach(x=>(groups[x[0].oblast]??=[]).push(x));
  $("#view-firmy").innerHTML=Object.entries(groups).map(([a,items])=>
    `<section class="area"><h2>${esc(a)} · ${items.length}</h2><div class="list">${items.map(([f,i])=>card(f,i)).join("")}</div></section>`).join("");
}

/* ---------- životopis ---------- */
const CVF=["jmeno","pozice","tel","email","praxe","dovednosti","uvazek","nastup","text"];
function cvGet(){const o={};CVF.forEach(k=>o[k]=$("#cv-"+k).value.trim());return o}
function cvMessage(f){
  const c=cvGet();
  const firma=f?f.nazev:"[název firmy]";
  if(c.text) return c.text.replace(/\[firma\]/gi,firma);
  const lines=[`Dobrý den,`,``,
   `obracím se na ${firma} s dotazem, zda nehledáte posilu${c.pozice?` na pozici ${c.pozice}`:""}.`];
  if(c.praxe) lines.push(``,`Praxe:`,c.praxe);
  if(c.dovednosti) lines.push(``,`Dovednosti:`,c.dovednosti);
  const extra=[c.uvazek&&`Úvazek: ${c.uvazek}`,c.nastup&&`Nástup: ${c.nastup}`].filter(Boolean);
  if(extra.length) lines.push(``,...extra);
  lines.push(``,`Rád se zastavím osobně nebo pošlu podrobný životopis.`,``,`S pozdravem`,c.jmeno||"[jméno]");
  [c.tel,c.email].filter(Boolean).forEach(x=>lines.push(x));
  return lines.join("\n");
}
function cvSave(){store.set("cv",cvGet());$("#cvprev").textContent=cvMessage(null);$("#saved").textContent="Uloženo v telefonu";clearTimeout(cvSave.t);cvSave.t=setTimeout(()=>$("#saved").textContent="",1500)}
function cvLoad(){
  const s=store.get("cv")||{jmeno:"Jan Novák",pozice:"provozní manažer",tel:"",email:"",praxe:"8 let v gastronomii, z toho 3 roky jako vedoucí směny (příklad – přepiš)",dovednosti:"vedení týmu, objednávky a sklad, pokladní systémy, angličtina",uvazek:"Plný úvazek",nastup:"ihned",text:""};
  CVF.forEach(k=>{if(s[k]!=null)$("#cv-"+k).value=s[k]});
  $("#cvprev").textContent=cvMessage(null);
}

/* ---------- psaní zprávy ---------- */
function compose(f){
  const msg=cvMessage(f), subj=`Zájem o práci – ${cvGet().pozice||"spolupráce"}`;
  const bg=document.createElement("div");bg.className="sheet-bg";
  const href=`mailto:${encodeURIComponent(f.email||"")}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}`;
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Zpráva pro ${esc(f.nazev)}">
    <h3>Zpráva pro ${esc(f.nazev)}</h3>
    ${f.email?`<p class="hint">E-mail: <strong>${esc(f.email)}</strong></p>`:`<p class="hint">Tahle firma zatím nemá v tabulce e-mail. Adresu doplníš v Mailu, nebo text zkopíruj a pošli přes jejich web či Facebook.</p>`}
    <div class="field"><label for="msgtxt">Text (můžeš upravit)</label><textarea id="msgtxt">${esc(msg)}</textarea></div>
    <div class="actions">
      <a class="btn primary" id="sendmail" href="${href}">${ICON.mail} Otevřít v Mailu</a>
      <button class="btn" id="copymsg">Zkopírovat text</button>
    </div>
    <button class="btn" id="closesheet">Zavřít</button></div>`;
  document.body.appendChild(bg);
  const ta=bg.querySelector("#msgtxt");
  ta.addEventListener("input",()=>bg.querySelector("#sendmail").href=`mailto:${encodeURIComponent(f.email||"")}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(ta.value)}`);
  bg.querySelector("#copymsg").onclick=async()=>{if(!await copy(ta.value)){ta.select();toast("Text je označený – zkopíruj ho")}};
  bg.querySelector("#closesheet").onclick=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg)bg.remove()});
}

/* ---------- události ---------- */
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.obor=b.dataset.o;st.area="";store.set("obor",st.obor);render();window.scrollTo(0,0)});
$("#area").addEventListener("change",e=>{st.area=e.target.value;render()});
$("#q").addEventListener("input",e=>{st.q=e.target.value;render()});
$("#view-firmy").addEventListener("click",e=>{
  const m=e.target.closest("[data-mail]");if(m){compose(firmy[+m.dataset.mail]);return}
  const t=e.target.closest("[data-copy]");if(t&&t.dataset.copy){copy(t.dataset.copy)} // číslo se zkopíruje i v případě, že náhled hovor nespustí
});
$("#cvform").addEventListener("input",cvSave);
$("#cvform").addEventListener("submit",e=>e.preventDefault());
function show(tab){
  const cv=tab==="cv";$("#view-cv").hidden=!cv;$("#view-firmy").hidden=cv;$("#hdr").hidden=cv;
  $("#tab-cv").setAttribute("aria-selected",cv);$("#tab-firmy").setAttribute("aria-selected",!cv);window.scrollTo(0,0);
}
$("#tab-firmy").onclick=()=>show("firmy");$("#tab-cv").onclick=()=>show("cv");

/* ---------- živá data z Google Sheetu (volitelné) ---------- */
function parseCSV(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}row.push(c);r.push(row);return r}
async function loadLive(){
  if(!LIVE_CSV_URL) return;
  try{
    const rows=parseCSV(await (await fetch(LIVE_CSV_URL)).text());
    const h=rows[0].map(x=>norm(x).trim());const ix=k=>h.indexOf(k);
    // Očekávané sloupce (čisté verze tabulky): obor, oblast, nazev, adresa, mesto, telefon, email, hodiny, styl, popis, web, overeno
    if(ix("nazev")<0) return;
    const data=rows.slice(1).filter(r=>r[ix("nazev")]).map(r=>{const o={};["obor","oblast","nazev","adresa","mesto","telefon","email","hodiny","styl","popis","web","overeno"].forEach(k=>o[k]=ix(k)>=0?(r[ix(k)]||"").trim():"");o.obor=o.obor||"Gastronomie";return o});
    if(data.length){firmy=data;render();toast("Načteno z tabulky")}
  }catch(e){/* zůstanou vložená data */}
}

st.obor=OBORY.includes(store.get("obor"))?store.get("obor"):"Gastronomie";
cvLoad(); render(); loadLive();
</script>
